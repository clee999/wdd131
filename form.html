<!doctype html>
<html lang="en-GB">
<head>
  <!-- Meta Charset -->
  <meta charset="utf-8">
  
  <!-- Meta Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Title -->
  <title>My Semantic and Well-Structured Page</title>
  
  <!-- Meta Description -->
  <meta name="description" content="A well-structured HTML template example.">
  
  <!-- Meta Author -->
  <meta name="author" content="Your Name">
  
  <!-- External Scripts and Styles -->
  <script src="scripts/form.js" defer></script>
  <link rel="stylesheet" href="styles/form.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Header -->
  <header>
    <h1>Product Review</h1>
  </header>
  
  <!-- Main Content -->
  <main>
    <form action="review.html" method="get">
      <label for="product-select">Product Names</label>
      <select id="product-select" name="product-name" required>
        <option value="" disabled selected>Select a Product...</option>
      </select>

      <!-- Overall Rating -->
      <fieldset>
        <legend>Overall Rating:</legend>
        <label for="star1">
          ⭐️ <input type="radio" id="star1" name="rating" value="1" required>
        </label>
        <label for="star2">
          ⭐️⭐️ <input type="radio" id="star2" name="rating" value="2"> 
        </label>
        <label for="star3">
          ⭐️⭐️⭐️ <input type="radio" id="star3" name="rating" value="3"> 
        </label>
        <label for="star4">
          ⭐️⭐️⭐️⭐️ <input type="radio" id="star4" name="rating" value="4"> 
        </label>
        <label for="star5">
          ⭐️⭐️⭐️⭐️⭐️ <input type="radio" id="star5" name="rating" value="5"> 
        </label>
      </fieldset>

      <!-- Date of Installation -->
      <label for="install-date">Date of Installation:</label>
      <input type="date" id="install-date" name="install-date" required>

      <!-- Useful Features -->
      <fieldset class="features">
        <legend>Which features did you find Useful? <br><i>(Check all that apply):</i></legend>
        <label for="feature1">
          Feature A <input type="checkbox" id="feature1" name="features" value="Feature A"> 
        </label>
        <label for="feature2">
          Feature B <input type="checkbox" id="feature2" name="features" value="Feature B"> 
        </label>
        <label for="feature3">
          Feature C <input type="checkbox" id="feature3" name="features" value="Feature C"> 
        </label>
        <label for="feature4">
          Feature D <input type="checkbox" id="feature4" name="features" value="Feature D"> 
        </label>
      </fieldset>

      <!-- Written Review -->
      <label for="written-review">Written Review:</label>
      <textarea id="written-review" name="written-review" rows="4" cols="50"></textarea>

      <!-- User Name -->
      <label for="user-name">Your Name:</label>
      <input type="text" id="user-name" name="user-name">

      <!-- Submit Button -->
      <input type="submit" value="Post Review">
    </form>
  </main>
  
  <!-- Footer -->
  <footer>
    <p>&copy; <span id="currentyear"></span> Carl Lee - United Kingdom</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
