<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EtooFitness | Join Us</title>
    <link rel="stylesheet" href="styles/fitness.css" />
    <style></style>
  </head>

  <body>
    <div id="content">
      <header>
        <div class="logo-box">
          <img
            src="https://cdn.glitch.me/3d2da9a8-addb-4fd9-ac2a-a0f2ae505863%2Fetoofitlogo.jpg?v=1638056674234"
            alt="logo"
          />
        </div>
        <nav>
          <ul>
            <li><a href="fitness.html">Home</a></li>
            <li><a href="sessions.html">Sessions</a></li>
            <li><a href="#">Join Us</a></li>
            <li><a href="#">FAQ</a></li>
          </ul>
        </nav>
      </header>
      <main>
        <div class="banner-box"></div>

        <div class="join-grid">
          <div id="join-section-1">
            <h1 class="join-headline-1">Start Your Journey</h1>
          </div>
          <div id="join-section-2">
            <a href="#" class="basic-membership"
              ><img
                class="join-left-img"
                src="https://cdn.glitch.me/3d2da9a8-addb-4fd9-ac2a-a0f2ae505863%2Fbasicmembership.jpg?v=1638055549189"
                alt="Basic membership"
            /></a>
            <a href="#" class="pro-membership"
              ><img
                class="join-right-img"
                src="https://cdn.glitch.me/3d2da9a8-addb-4fd9-ac2a-a0f2ae505863%2Fpromemberpic.jpg?v=1638055463615"
                alt="Pro membership"
            /></a>
          </div>
          <div id="join-section-3">
            <p class="join-paragraph-1">
              At EtooFit, we're committed to providing a safe and welcoming
              place for everybody you can train with confidence at the UK's
              favourite gym.
              <a href="https://www.youtube.com/watch?v=OsYxL8hs9EA">Find out</a>
              more filling out the form below.
            </p>
          </div>

          <div id="join-section-4">
            <form class="join-form">
              <ul>
                <li>
                  <label for="fname">First Name</label>
                  <input type="text" id="fname" name="user_name" />
                </li>
                <li>
                  <label for="lname">Last Name</label>
                  <input type="text" id="lname" name="user_name" />
                </li>
                <li>
                  <label for="mail"> E-mail</label>
                  <input type="email" id="mail" name="user_email" />
                </li>
                <li>
                  <label for="number"> Phone </label>
                  <input type="number" id="number" name="user_email" />
                </li>
                <li>
                  <label for="msg">Additional info.</label>
                  <textarea id="msg" name="user_message"></textarea>
                </li>

                <li class="button">
                  <button id="join-button">Join</button>
                  <button id="cancel-button">Cancel</button>
                </li>
              </ul>
            </form>

            <div id="terms-section">
              <div id="tc-section">
                <ul>
                  <li>
                    <input type="checkbox" id="tc1" name="T&C" />
                    <label id="tc2">Terms & Conditions</label>
                  </li>
                </ul>
              </div>
              <div id="pr-section">
                <ul>
                  <li>
                    <input type="checkbox" id="pr1" name="Privacy" />
                    <label id="pr2"
                      >I have read and agreed to the
                      <a>privacy policy</a></label
                    >
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </main>

      <footer class="join-footer">
        <p id="copy">&copy; 2021 Etoofitness - Carl Lee</p>
        <a href="site-plan.html">Site Plan</a>
        <a href="#">Contact Us</a>
        <div class="social">
          <a href="https://www.facebook.com/thegymgroup/"
            ><img
              src="https://cdn.glitch.com/1c023aaf-bcd5-427c-9cbe-fac810950c1a%2Ffacebook.png?v=1633363636997"
              alt="Facebook icon"
          /></a>
          <a href="https://www.instagram.com/thegymgroup/?hl=en"
            ><img
              src="https://cdn.glitch.com/1c023aaf-bcd5-427c-9cbe-fac810950c1a%2Finstagram.png?v=1633363636956"
              alt="Instagram icon"
          /></a>
          <a href="https://www.youtube.com/watch?v=Z4QRTf6mBF4"
            ><img
              src="https://cdn.glitch.com/1c023aaf-bcd5-427c-9cbe-fac810950c1a%2Fyoutube.png?v=1633363636974"
              alt="YouTube icon"
          /></a>
        </div>
      </footer>
    </div>
  </body>
</html>
